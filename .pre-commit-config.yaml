repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.3
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.8.2
          - PyYAML==6.0.2
          - types-PyYAML==6.0.12.20240808
          - reportlab==4.2.2
          - typer==0.12.5
          - click==8.1.7
