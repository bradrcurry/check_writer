[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "check-printing"
version = "0.1.0"
description = "Generate print-ready duplex PDFs for compact personal check printing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "check_printing maintainers" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "reportlab==5.0.0",
  "typer==0.26.7",
  "click==8.4.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.1.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.18",
  "pre-commit==4.6.0",
  "types-PyYAML==6.0.12.20260518",
]
fonts = [
  "fonttools==4.63.0",
  "pillow==12.2.0",
]
ui = [
  "streamlit==1.58.0",
  "pymupdf==1.27.2.3",
]
api = [
  "fastapi==0.138.0",
  "uvicorn==0.49.0",
]

[project.scripts]
check-print = "check_printing.cli:app"

[tool.setuptools.packages.find]
include = ["check_printing*"]

[tool.setuptools.package-data]
check_printing = ["layout_templates.yaml"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["check_printing", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"check_printing/cli.py" = ["B008", "UP007"]

[tool.mypy]
python_version = "3.12"
packages = ["check_printing"]
strict = true
warn_unreachable = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=check_printing --cov-report=term-missing"
testpaths = ["tests"]
